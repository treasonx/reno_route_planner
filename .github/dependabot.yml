version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint (<6.1) and openapi-typescript (^5) don't support TypeScript 6/7 yet,
      # so a major bump breaks `npm ci`. Remove once both widen their peer ranges.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
