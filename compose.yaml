# Example: run Pass Check from the public image.
#   cp .env.example .env   # optional: fill in WU_API_KEY / NDOT_API_KEY
#   docker compose up -d
#   open http://localhost:8000
services:
  pass-check:
    image: ghcr.io/treasonx/reno_route_planner:latest
    container_name: pass-check
    ports:
      - "8000:8000"            # use "127.0.0.1:8000:8000" when a reverse proxy sits in front
    # Values come from a .env file next to this compose.yaml (Compose reads it automatically
    # for ${...} substitution) or from your shell. Every key is optional: an empty value
    # means that source is off, and the app still runs on Caltrans + Open-Meteo.
    environment:
      WU_API_KEY: ${WU_API_KEY:-}        # Weather Underground daily snow cross-check
      NDOT_API_KEY: ${NDOT_API_KEY:-}    # Nevada 511 live road conditions
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
